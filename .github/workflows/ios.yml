name: iOS Platform CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'

jobs:
  build-ios:
    name: Build iOS Extension & App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Validate Swift Syntax
        run: |
          find ios -name "*.swift" -exec swiftc -parse {} +
